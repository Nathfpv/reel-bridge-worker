name: Verify isolated public worker

on:
  push:
    branches: [main, codex/reel-bridge-ha-worker]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check src/process-job.js && node --check src/analyzer.js && node --check src/result-transport.js
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
